name: Update prices

on:
  workflow_dispatch:
  schedule:
    # 每天 09:00 中国时间（UTC 01:00）
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape, multi-method validate & regenerate
        run: python scripts/refresh_prices.py
        env:
          SKIP_EXCEL: "1"
          SKIP_CANVAS: "1"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh tungsten prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
